<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiCompute × XDC — Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #030014;
            --bg-dark: #0a0a1a;
            --accent-cyan: #00e5ff;
            --accent-blue: #2979ff;
            --accent-purple: #7c4dff;
            --accent-green: #00e676;
            --accent-gold: #ffd600;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .banner {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-orbs {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: orbFloat 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-blue), transparent 70%);
            top: -150px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            bottom: -100px;
            right: -50px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
            top: 50%;
            left: 60%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        /* ===== PARTICLES ===== */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0;
            animation: particleRise 8s linear infinite;
        }

        @keyframes particleRise {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.8; transform: translateY(90vh) scale(1); }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(0.5); }
        }

        /* ===== CONTENT ===== */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 80px;
        }

        /* Logos row */
        .logos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            margin-bottom: 48px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 28px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            animation: logoGlow 4s ease-in-out infinite;
        }

        .logo-box.dicompute {
            border-color: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .logo-box.xdc {
            border-color: rgba(0, 230, 118, 0.2);
            box-shadow: 0 0 40px rgba(0, 230, 118, 0.08), inset 0 1px 0 rgba(255,255,255,0.06);
            animation-delay: -2s;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.06); }
            50% { box-shadow: 0 0 60px rgba(0, 229, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.08); }
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            position: relative;
        }

        .dicompute .logo-icon {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #030014;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .xdc .logo-icon {
            background: linear-gradient(135deg, var(--accent-green), #00c853);
            color: #030014;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
        }

        .logo-text {
            text-align: left;
        }

        .logo-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .logo-tag {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .dicompute .logo-tag { color: var(--accent-cyan); }
        .xdc .logo-tag { color: var(--accent-green); }

        .logo-divider {
            width: 1px;
            height: 48px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* ===== MAIN HEADLINE ===== */
        .headline {
            margin-bottom: 28px;
        }

        .headline-main {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.05;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .headline-main .gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .headline-sub {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.3px;
        }

        /* ===== TAGLINE ===== */
        .tagline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
        }

        .tagline-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .tagline-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: dotPulse 2s ease-in-out infinite;
        }

        .tagline-item:nth-child(2) .tagline-dot {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation-delay: -0.7s;
        }

        .tagline-item:nth-child(3) .tagline-dot {
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
            animation-delay: -1.4s;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .tagline-sep {
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
        }

        /* ===== BOTTOM BADGE ===== */
        .bottom-badge {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
        }

        .badge-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .badge-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .badge-text span {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* ===== SCANLINE EFFECT ===== */
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 229, 255, 0.02) 50%,
                transparent 100%
            );
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* ===== CORNER DECORATIONS ===== */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* ===== FLOATING GPU ICONS ===== */
        .floating-icons {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .float-icon {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 1px;
            animation: floatDrift 15s ease-in-out infinite;
        }

        .float-icon:nth-child(1) { top: 15%; left: 8%; animation-delay: 0s; }
        .float-icon:nth-child(2) { top: 25%; right: 10%; animation-delay: -3s; }
        .float-icon:nth-child(3) { bottom: 30%; left: 12%; animation-delay: -6s; }
        .float-icon:nth-child(4) { bottom: 20%; right: 15%; animation-delay: -9s; }
        .float-icon:nth-child(5) { top: 60%; left: 5%; animation-delay: -12s; }

        @keyframes floatDrift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.06; }
            50% { transform: translate(10px, -15px) rotate(2deg); opacity: 0.1; }
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="banner">
        <!-- Background -->
        <div class="bg-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="grid-overlay"></div>
        <div class="scanline"></div>

        <!-- Floating background text -->
        <div class="floating-icons">
            <span class="float-icon">GPU_CLUSTER_01</span>
            <span class="float-icon">INFERENCE_NODE</span>
            <span class="float-icon">XDC_SETTLE</span>
            <span class="float-icon">MODEL_LOADED</span>
            <span class="float-icon">COMPUTE_POOL</span>
        </div>

        <!-- Particles -->
        <div class="particles" id="particles"></div>

        <!-- Corner decorations -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Main Content -->
        <div class="content">
            <!-- Logos -->
            <div class="logos-row">
                <div class="logo-box dicompute">
                    <div class="logo-icon">◈</div>
                    <div class="logo-text">
                        <div class="logo-name">DiCompute</div>
                        <div class="logo-tag">AI Compute</div>
                    </div>
                </div>
                <div class="logo-divider"></div>
                <div class="logo-box xdc">
                    <div class="logo-icon">◇</div>
                    <div class="logo-text">
                        <div class="logo-name">XDC</div>
                        <div class="logo-tag">Network</div>
                    </div>
                </div>
            </div>

            <!-- Headline -->
            <div class="headline">
                <div class="headline-main">
                    <span class="gradient-text">Decentralized AI Compute</span><br>
                    Powered by Blockchain
                </div>
                <div class="headline-sub">
                    The world's idle GPUs, orchestrated. Paid per request. Settled on XDC.
                </div>
            </div>

            <!-- Tagline -->
            <div class="tagline">
                <div class="tagline-item">
                    <div class="tagline-dot"></div>
                    <span>Open Models</span>
                </div>
                <div class="tagline-sep"></div>
                <div class="tagline-item">
                    <div class="tagline-dot"></div>
                    <span>Per-Request Billing</span>
                </div>
                <div class="tagline-sep"></div>
                <div class="tagline-item">
                    <div class="tagline-dot"></div>
                    <span>Instant Settlement</span>
                </div>
            </div>
        </div>

        <!-- Bottom badge -->
        <div class="bottom-badge">
            <div class="badge-icon">⚡</div>
            <div class="badge-text">COMPUTE <span>×</span> CRYPTO <span>×</span> AI</div>
        </div>
    </div>

    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = (6 + Math.random() * 4) + 's';
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
